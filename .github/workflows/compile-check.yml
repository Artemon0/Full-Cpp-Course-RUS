name: Compile Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  compile:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        
    steps:
    - uses: actions/checkout@v3
    
    - name: Install g++ (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y g++
        sudo locale-gen ru_RU.UTF-8
        export LANG=ru_RU.UTF-8
        export LC_ALL=ru_RU.UTF-8
        
    - name: Install g++ (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        update: true
        install: mingw-w64-x86_64-gcc
        
    - name: Verify g++
      run: g++ --version
      
    - name: Check files
      run: |
        echo "Checking if files exist..."
        ls -la "01_Основы/" || echo "Directory not found"
        ls -la "01_Основы/01_hello_world.cpp" || echo "File not found"
      
    - name: Compile Basics
      continue-on-error: true
      run: |
        g++ "01_Основы/01_hello_world.cpp" -o test1 || echo "FAILED: 01_hello_world.cpp"
        g++ "01_Основы/02_переменные.cpp" -o test2 || echo "FAILED: 02_переменные.cpp"
        g++ "01_Основы/03_операторы.cpp" -o test3 || echo "FAILED: 03_операторы.cpp"
        
    - name: Compile Control Structures
      continue-on-error: true
      run: |
        g++ "02_Управляющие_конструкции/01_if_else.cpp" -o test4 || echo "FAILED: 01_if_else.cpp"
        g++ "02_Управляющие_конструкции/02_циклы.cpp" -o test5 || echo "FAILED: 02_циклы.cpp"
        g++ "02_Управляющие_конструкции/03_switch.cpp" -o test6 || echo "FAILED: 03_switch.cpp"
        
    - name: Compile Functions
      continue-on-error: true
      run: |
        g++ "03_Функции/01_основы_функций.cpp" -o test7 || echo "FAILED: 01_основы_функций.cpp"
        g++ "03_Функции/02_перегрузка_функций.cpp" -o test8 || echo "FAILED: 02_перегрузка_функций.cpp"
        
    - name: Compile Arrays
      continue-on-error: true
      run: |
        g++ "04_Массивы_и_строки/01_массивы.cpp" -o test9 || echo "FAILED: 01_массивы.cpp"
        
    - name: Compile Pointers
      continue-on-error: true
      run: |
        g++ "05_Указатели_и_ссылки/01_указатели.cpp" -o test10 || echo "FAILED: 01_указатели.cpp"
        g++ "05_Указатели_и_ссылки/02_ссылки.cpp" -o test11 || echo "FAILED: 02_ссылки.cpp"
        
    - name: Compile OOP
      continue-on-error: true
      run: |
        g++ "06_ООП/01_классы_и_объекты.cpp" -o test12 || echo "FAILED: 01_классы_и_объекты.cpp"
        g++ "06_ООП/02_наследование.cpp" -o test13 || echo "FAILED: 02_наследование.cpp"
        
    - name: Compile STL
      continue-on-error: true
      run: |
        g++ -std=c++11 "07_STL/01_vector.cpp" -o test14 || echo "FAILED: 01_vector.cpp"
        g++ -std=c++11 "07_STL/02_string.cpp" -o test15 || echo "FAILED: 02_string.cpp"
        g++ -std=c++11 "07_STL/03_map.cpp" -o test16 || echo "FAILED: 03_map.cpp"
        
    - name: Compile Files
      continue-on-error: true
      run: |
        g++ "08_Файлы/01_чтение_и_запись.cpp" -o test17 || echo "FAILED: 01_чтение_и_запись.cpp"
        
    - name: Compile Advanced
      continue-on-error: true
      run: |
        g++ -std=c++11 "09_Продвинутые_темы/01_шаблоны.cpp" -o test18 || echo "FAILED: 01_шаблоны.cpp"
        g++ "09_Продвинутые_темы/02_исключения.cpp" -o test19 || echo "FAILED: 02_исключения.cpp"
        
    - name: Compile Games
      continue-on-error: true
      run: |
        g++ "Игры/01_Угадай_число/game.cpp" -o game1 || echo "FAILED: game1"
        g++ "Игры/02_Камень_ножницы_бумага/game.cpp" -o game2 || echo "FAILED: game2"
        g++ "Игры/03_Виселица/game.cpp" -o game3 || echo "FAILED: game3"
        g++ "Игры/04_Крестики_нолики/game.cpp" -o game4 || echo "FAILED: game4"
        
    - name: Compile Header Examples
      continue-on-error: true
      run: |
        cd "05_Указатели_и_ссылки/примеры_с_заголовками"
        g++ main.cpp math.cpp -o example1 || echo "FAILED: example1"
        g++ main_student.cpp Student.cpp -o example2 || echo "FAILED: example2"
        g++ main_calculator.cpp Calculator.cpp -o example3 || echo "FAILED: example3"
        g++ main_array.cpp Array.cpp -o example4 || echo "FAILED: example4"
